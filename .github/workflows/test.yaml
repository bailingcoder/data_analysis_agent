name: tests
on: [push, pull_request]        # 每次 push 和提 PR 都触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -v