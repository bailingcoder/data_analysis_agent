logging:
  version: 1
  disable_existing_loggers: false

  formatters:
    simple:
      format: "%(asctime)s | %(levelname)s | %(message)s"
    detail:
      format: "%(asctime)s | %(levelname)s | %(name)s | %(funcName)s:%(lineno)d | %(message)s"

  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: simple
      stream: ext://sys.stdout

    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: detail
      filename: logs/file.log
      maxBytes: 5242880
      backupCount: 5
      encoding: utf-8

    error_file:
      class: logging.handlers.RotatingFileHandler
      level: ERROR
      formatter: detail
      filename: logs/err_file.log
      maxBytes: 5242880
      backupCount: 5
      encoding: utf-8

  loggers:
    data_analysis_agent:
      level: DEBUG
      handlers: [file, error_file]
      propagate: true

  root:
    level: INFO
    handlers: [console]